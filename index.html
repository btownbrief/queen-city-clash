<style>
/* Layout: one arcade screen, centered. Touch pads sit under it in portrait and float over its corners in landscape. */
:root{
  --void:#0d0a1a; --rim:#2a2046; --ink:#efe8ff; --muted:#9d93c2; --hair:#ff9ad0; --scarf:#e0342c; --suit:#3346e0; --energy:#5bc0ff;
  --pixel:Rajdhani, 'Segoe UI', system-ui, sans-serif;
  --reserve:64px; --b:clamp(44px,13vw,60px);
  color-scheme:dark;
}
html,body{height:100%;touch-action:manipulation}
body{margin:0;background:var(--void);color:var(--ink);font-family:var(--pixel);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#app{box-sizing:border-box;height:var(--sh,100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#screen{position:relative;width:min(100%, calc((100vh - var(--reserve) - 20px) * 16 / 9));width:min(100%, calc((var(--sh,100dvh) - var(--reserve) - 20px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)) * 16 / 9));max-width:100%}
canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;background:#000;box-shadow:0 0 0 2px #000,0 0 0 5px var(--rim),0 18px 50px rgba(0,0,0,.55);cursor:pointer;touch-action:none}
.bar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.04em;max-width:100%}
.keys{display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:center}
kbd{font-family:var(--pixel);color:var(--ink);background:#1d1633;border:1px solid var(--rim);border-bottom-width:3px;padding:0 5px;border-radius:2px}
.tbtn{font:inherit;color:var(--ink);background:#1d1633;border:2px solid var(--rim);padding:3px 10px;cursor:pointer}
.tbtn.hi{border-color:var(--hair);color:#fff}
.tbtn:focus-visible,.pb:focus-visible{outline:2px solid var(--hair);outline-offset:2px}
.credit{color:var(--hair)}
#pad{display:none;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#stick{position:absolute;left:0;top:0;bottom:0;width:48%;touch-action:none}
#stick .base{position:absolute;left:var(--sx,30%);top:var(--sy,55%);width:var(--sr);height:var(--sr);margin:calc(var(--sr) / -2) 0 0 calc(var(--sr) / -2);border-radius:50%;border:3px solid rgba(255,255,255,.25);background:rgba(20,14,40,.45);opacity:.6}
#stick.on .base{opacity:1}
#stick .knob{position:absolute;left:50%;top:50%;width:46%;height:46%;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffffff,#bfb4e6);box-shadow:0 3px 0 rgba(0,0,0,.45);transform:translate(-50%,-50%) translate(var(--kx,0px),var(--ky,0px))}
#stick .lbl{font-family:Rajdhani,'Segoe UI',system-ui,sans-serif;position:absolute;left:var(--sx,30%);top:calc(var(--sy,55%) + var(--sr) / 2 + 6px);transform:translateX(-50%);font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.12em;pointer-events:none;white-space:nowrap}
#stick.on .lbl{display:none}
.btns{position:absolute;right:max(6px,env(safe-area-inset-right,0px));bottom:6px;width:calc(var(--b) * 4.1);height:calc(var(--b) * 3.1);touch-action:none}
.pb{position:absolute;font-family:Rajdhani,'Segoe UI',system-ui,sans-serif;font-weight:700;font-size:12px;color:#fff;border:3px solid #000;border-radius:50%;width:var(--b);height:var(--b);box-shadow:0 4px 0 #000,inset 0 -5px 0 rgba(0,0,0,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;touch-action:none;-webkit-user-select:none;user-select:none;line-height:1.05}
.pb small{display:block;font-size:8px;opacity:.9;margin-top:2px;max-width:92%;overflow:hidden;white-space:nowrap}
.pb.on{transform:translateY(3px);box-shadow:0 1px 0 #000,inset 0 -2px 0 rgba(0,0,0,.25),0 0 0 4px rgba(255,255,255,.6),0 0 22px 8px rgba(255,255,255,.35);filter:brightness(1.35)}
.pb::after{content:'';position:absolute;inset:-5px;border-radius:inherit}
.pb.atk{width:calc(var(--b) * 1.5);height:calc(var(--b) * 1.5);right:calc(var(--b) * .2);bottom:calc(var(--b) * .2);background:#d9468f;font-size:15px}
.pb.spc{width:calc(var(--b) * 1.05);height:calc(var(--b) * 1.05);right:calc(var(--b) * 1.95);bottom:calc(var(--b) * .1);background:#3346e0;font-size:10px}
.pb.jmp{width:calc(var(--b) * 1.25);height:calc(var(--b) * 1.25);right:calc(var(--b) * 1.75);bottom:calc(var(--b) * 1.35);background:#6b54b0;font-size:14px}
.pb.shd{width:calc(var(--b) * 1.05);height:calc(var(--b) * 1.05);right:calc(var(--b) * .45);bottom:calc(var(--b) * 1.95);background:#1b8f80;font-size:11px}
.pb.sup{right:calc(var(--b) * 3.15);bottom:calc(var(--b) * 1.9);width:calc(var(--b) * .85);height:calc(var(--b) * .85);background:#4a1820;opacity:.4;font-size:10px}
.pb.sup.ready{opacity:1;background:#e0342c;animation:pulse .5s steps(2) infinite}
@keyframes pulse{50%{filter:brightness(1.6)}}
@media (prefers-reduced-motion: reduce){.pb.sup.ready{animation:none}}
#tpause{position:fixed;z-index:5;right:max(8px,env(safe-area-inset-right,0px));top:max(8px,env(safe-area-inset-top,0px));width:42px;height:36px;border-radius:8px;border:2px solid var(--rim);background:rgba(20,14,40,.75);color:#fff;font:700 14px Rajdhani,system-ui,sans-serif;touch-action:manipulation;display:none}
body.playing #tpause{display:block}
#rot{position:absolute;left:50%;top:6px;transform:translateX(-50%);font-family:Rajdhani,'Segoe UI',system-ui,sans-serif;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.06em;white-space:nowrap;pointer-events:none}
/* Phones: the game sits on top and a gamepad fills the rest of the screen. Turned sideways, the game fills the screen and the pad floats over it. */
@media (hover:none) and (pointer:coarse){
  :root{--b:calc(clamp(44px,12.5vw,58px) * var(--bs,1));--sr:calc(clamp(96px,27vw,124px) * var(--bs,1))}
  #app{justify-content:flex-start;gap:0;padding:max(8px,env(safe-area-inset-top,0px)) 8px 0 8px}
  #screen{width:100%}
  .bar{display:none}
  #pad{display:block;position:relative;flex:1;width:100%;min-height:170px;margin-bottom:env(safe-area-inset-bottom,0px)}
  .btns{bottom:clamp(10px,calc(50% - var(--b) * 1.65),240px)}
  #stick{--sy:50%}
}
@media (hover:none) and (pointer:coarse) and (orientation:portrait){
  #stick{width:40%;--sx:50%}
  :root{--sr:calc(min(26vh - 44px, 36vw) * var(--bs,1))}
  .btns{top:24px;right:8px;bottom:8px;height:auto;width:min(calc(58% * var(--bs,1)),72%);display:grid;grid-template-columns:1fr 1.45fr 1fr;grid-template-rows:1.15fr 1.2fr;gap:8px}
  .btns .pb{position:relative;inset:auto;width:auto;height:auto;border-radius:18px;font-size:15px}
  .btns .pb.sup{grid-area:1/1;font-size:12px}.btns .pb.shd{grid-area:1/3}.btns .pb.jmp{grid-area:1/2;font-size:20px}.btns .pb.spc{grid-area:2/1;font-size:13px}.btns .pb.atk{grid-area:2/2/3/4;font-size:22px}
  .btns .pb small{font-size:8px;max-width:96%}
}
@media (hover:none) and (pointer:coarse) and (orientation:landscape){
  :root{--b:calc(clamp(46px,13vh,60px) * var(--bs,1));--sr:calc(clamp(84px,24vh,112px) * var(--bs,1))}
  #app{padding:0;justify-content:center}
  #screen{width:min(100vw,calc(var(--sh,100dvh) * 16 / 9))}
  canvas{box-shadow:none}
  #pad{position:fixed;inset:0;min-height:0;margin:0;pointer-events:none}
  body:not(.playing) #pad{display:none}
  #stick,.btns,#tpause{pointer-events:auto}
  #stick{top:18%}
  .btns{bottom:max(6px,env(safe-area-inset-bottom,0px))}
  .pb{opacity:.5}.pb.on{opacity:.95}.pb.sup{opacity:.25}.pb.sup.ready{opacity:.9}
  #stick .base{opacity:.16}#stick.on .base{opacity:.75}
  #rot{display:none}
}
</style>

<div id="app">
  <div id="screen"><canvas id="cv" role="img" aria-label="Queen City Clash game screen"></canvas></div>
  <div class="bar">
    <span class="keys"><span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move</span><span><kbd>Space</kbd> jump</span><span><kbd>J</kbd> attack</span><span><kbd>K</kbd> special</span><span><kbd>L</kbd> shield</span></span>

<script>
// Queen City Clash: the engine below starts once the fighter rigs (small .js files) are in;
// their painted parts stream in afterwards.
window.QCC_BOOT=fn=>FIGHTERS_LOADED.then(fn).catch(e=>{console.error(e);document.body.insertAdjacentHTML('beforeend','<pre style="position:fixed;left:8px;top:8px;color:#ff6b6b;font:14px monospace;white-space:pre-wrap;z-index:9">'+(e&&e.stack||e)+'</pre>');});
</script>
<script>
QCC_BOOT(()=>{
'use strict';
/* ================= QUEEN CITY CLASH =================
   Everything below is new code for Queen City Clash, spliced into the copied Scarf Kid engine by
   tools/apply-qcc.py (right after 'use strict', so it runs first). It only declares functions and vars;
   the engine calls them from the small edits listed in UPSTREAM.md.
   - fighters: the painted rigs (rig.js + fighters/*.js) replace the code-drawn Scarf Kid fighters
   - stages: painted backgrounds with platforms measured from the art (qcc-data.js)
   - unlocks: new areas earned in Arcade and Battle
   - SIG: each fighter's signature special */
// Older iPhones (iOS 15 and earlier) have no roundRect; the engine uses it for HUD and effects.
for (const P of [window.CanvasRenderingContext2D, window.Path2D]) if (P && !P.prototype.roundRect) P.prototype.roundRect = function (x, y, w, h, r) {
  const q = Math.min(Math.abs(w), Math.abs(h)) / 2, rr = (Array.isArray(r) ? r : [r || 0]).map((v) => Math.min(+v || 0, q));
  const [a, b = a, c = a, d = b] = rr;
  this.moveTo(x + a, y); this.lineTo(x + w - b, y); this.quadraticCurveTo(x + w, y, x + w, y + b); this.lineTo(x + w, y + h - c);
  this.quadraticCurveTo(x + w, y + h, x + w - c, y + h); this.lineTo(x + d, y + h); this.quadraticCurveTo(x, y + h, x, y + h - d); this.lineTo(x, y + a); this.quadraticCurveTo(x, y, x + a, y); this.closePath();
};
var QSTAGES = QCC_DATA.stages;
var RIGK = 0.17;   // world units per v2 screen pixel: fighter size in the world = rig scale * RIGK per painting pixel

/* ---------- fighters ---------- */
// The engine's card -> character. Physics, hitboxes and hurtbox are Scarf Kid's own (from the style).
// Only the drawing changes: the painting is scaled so the body stands 46 units x the style's size tall,
// exactly as tall as Scarf Kid's fighters. Very wide paintings (Whale Tails is two whales) are fitted by
// width instead, so no fighter towers over the stage.
function qccChar(c, k) {
  const R = FIGHTERS[k.id];
  c.rk = 46 * c.s / Math.max(R.box[1], R.box[0] * 0.62);   // world units per painting pixel (first guess)
  // Then match Scarf Kid's on-screen size: its fighters' art stands about 58 x size units tall (hair and
  // all, measured from its own renderer), taller than their 46-unit hurtbox. Ours stand 60 x size, and
  // the very wide ones (Whale Tails, Tow Truck) are capped at 100 units across.
  if (R.meta || R.art) { const b = RIG.bounds(R, RIG.poseOf(R, "idle", 0)), h = (b[3] - b[1]) * c.rk, w = (b[2] - b[0]) * c.rk;
    if (h > 0 && w > 0) { c.rk *= Math.min(60 * c.s / h, 100 / w);
      // Scarf Kid's art is about 2.4x as wide as its 14-unit hurtbox. Keep that proportion: a bulky painted
      // fighter gets a hurtbox as much wider as its art is, and its attacks reach out by the same amount
      // (reachHitboxes), so the spacing between any two fighters plays like Scarf Kid.
      const aw = (b[2] - b[0]) * c.rk / c.s;   // art width in the 46-unit frame
      c.hw = Math.max(7, Math.min(aw / 4.8, QHWMAX)); } }   // round 7: 9 (was 11), thinner like Scarf Kid   // half of (width / 2.4), capped at 11 in round 3 (Scarf Kid is 7 for all): bulky fighters were too easy to hit
  // Round 3: Stephen found the jumps too low. Our painted fighters read bigger and bulkier than Scarf Kid's
  // stick-figure-sized ones, so the same jump looks small, worst for the heavies and blobs. Raise the jump
  // height per style (speed goes up by the square root), and the up-special rise a little.
  const JUMPK = { brawler: 1.3, speedster: 1.25, showoff: 1.3, blob: 1.45, heavy: 1.6 };
  // Round 4: the arenas are 30% wider (QW), so every jump goes 30% higher again and fighters drift and run
  // a little faster, to cover the extra room. Up-special rises scale the same way so recoveries still reach.
  if (!c.jumpBoosted) { c.jumpBoosted = true; c.jump *= Math.sqrt((JUMPK[k.style] || 1.3) * QJ); if (c.rise) c.rise *= Math.sqrt(1.15 * QJ);
    c.air *= 1.1; c.airAcc *= 1.1; c.run *= 1.08; c.dash *= 1.08;
    c.jump *= QJV; c.run *= QRUN; c.dash *= QRUN; c.air *= QAIR; c.airAcc *= QAIR; }   // round 7 pace
  c.power = k.power || Math.max(1, Math.min(6, Math.round((R.stats.power - 0.6) * 6) + 1));
  c.col = { top: k.aura };
  c.spShort = k.spShort || SPSHORT[k.id];   // the phone's SPECIAL button label
  c.feel = k.feel || null;   // round 4: how this fighter's normal attacks feel (qccFeel)
  return c;
}
/* ---------- round 4: bigger arenas ----------
   Stephen wanted more room. Every Scarf Kid stage shape is stretched 30% sideways about the middle (QW) and
   its platforms sit 15% higher above the floor (QV). The knockout lines move out with the stage edges (a bit
   more than the edges, for the higher jumps), the camera may zoom out to 0.72 (QZMIN) so both fighters stay
   in view, and the platform drawing gets QPX of room on each side. Fighters close together look as big as
   before; only when they are far apart does the camera pull back. */
var QW = 1.3, QV = 1.15, QJ = 1.3, QZMIN = 0.72, QPX = 110, QBK = 480 / (480 + 2 * 110);
// Round 7 pace (Stephen: QCC felt floatier and slower than Scarf Kid; go halfway on jumps, faster, Scarf Kid-size
// fighters, thinner). Jumps launch 6% slower (QJV) and fall 13% harder while airborne (QG): height lands halfway
// between Scarf Kid and round 6, and so does time in the air. Running is 20% faster (QRUN): crossing the 30%
// wider floor takes Scarf Kid's 2 seconds. Fighters draw 8% bigger (QBIG) and 15% narrower (QTHIN).
var QJV = 0.94, QG = 1.13, QRUN = 1.2, QAIR = 1.08, QBIG = 1.08, QTHIN = 0.85, QHWMAX = 9;
function qccWiden(L) {
  const M = L.main, X = (x) => 240 + (x - 240) * QW, Y = (y) => M.y + (y - M.y) * QV;
  const soft = L.soft.length ? L.soft : [{ x0: 186, x1: 294, y: 136 }];   // round 5: every arena has at least one platform (Scarf Kid's flat stage had none)
  return { main: { x0: X(M.x0), x1: X(M.x1), y: M.y, bot: M.bot }, hazard: L.hazard,
    soft: soft.map((P) => Object.assign({}, P, { x0: X(P.x0), x1: X(P.x1), y: Y(P.y), move: P.move && Object.assign({}, P.move, { ax: P.move.ax * QW, ay: P.move.ay * QV }) })) };
}
function qccCamX(cx, hw) { const r = 270 * QW; return hw >= r ? 240 : clamp(cx, 240 - r + hw, 240 + r - hw); }   // Scarf Kid let the view go 30 past the 480-wide world
// The phone's real screen height, locked: it changes only when the phone turns (the width changes), when the
// screen gets smaller (Safari's toolbar first appears), or when it grows a lot (the keyboard closes). Small
// changes from the toolbar sliding in and out are ignored, so the game and buttons keep one size.
var QH = { w: 0, h: 0 };
function qccH() {
  const w = innerWidth, h = innerHeight;
  if (w !== QH.w || !QH.h || h < QH.h - 2 || h > QH.h * 1.25) { QH.w = w; QH.h = h; document.documentElement.style.setProperty("--sh", h + "px"); }
  return QH.h;
}
// round 3: the CPU should not fire a close-range neutral special from across the stage
var CLOSE_SIG = { glide: 1, stamp: 1, burrow: 1, puddle: 1, scatter: 1, flash: 1 };
function qccCloseSig(f) { const m = f.c.mv.nspec; return m && m.sig && CLOSE_SIG[m.sig] ? m.sig : null; }
var SPSHORT = { heroic: "SWIRL", brawler: "NAPKIN", champ: "WAVE", monkey: "GLIDE", catamount: "STEP", cabinet: "STAMP", whale: "BURROW",
  outback: "HEADLIGHTS", syrup: "PUDDLE", snow: "PICKLE", tow: "HOOK", bus: "SPARK", crow: "SCATTER" };
function posemap() {
  return posemap.m || (posemap.m = { idle0: "idle", idle1: "idle", walk0: "run", walk1: "run", walk2: "run", jump: "jump", fall: "fall",
    punch: "strike", punch2: "strike", chamber: "windup", kick: "kick", spark: "kick", upper: "upper", rise: "rise", spike: "spike", nair: "nair",
    bair: "bair", guard: "guard", down: "down", crouch: "crouch", sweep: "sweep", ledge: "ledge", hit: "hit", windup: "windup", blast: "special",
    super: "strike", win: "win", slam: "slam", bite: "strike", pillar: "upper", flop: "spike", dive: "kick", headbutt: "upper", slash: "strike",
    special: "special", dodge: "dodge", grab: "grab", throw: "throw" });
}
// a pose a fighter is missing falls back to one it has
var POSEBACK = { crouch: "idle", sweep: "strike", upper: "strike", kick: "strike", nair: "jump", bair: "strike", spike: "fall", slam: "strike",
  guard: "windup", dodge: "jump", grab: "strike", throw: "strike", ledge: "fall", down: "hit", special: "strike", rise: "jump", win: "idle" };
function rigPoseOf(R, key, u) { return RIG.poseOf(R, key, u) || RIG.poseOf(R, POSEBACK[key] || "idle", u) || RIG.poseOf(R, "idle", 0); }

function poseKey(name, pn, m) {
  if (m && m.grab) return "grab";
  const k = posemap()[pn];
  return k === "special" && !/spec|super/.test(name) ? "strike" : k;   // 'blast' is a two-hand push; only specials use the signature pose
}
// Which rig pose to show. Every Scarf Kid pose name (punch, chamber, spark, bite, pillar...) is used directly
// when the fighter has that pose, so each move looks the way it does in Scarf Kid; older rigs fall back.
function rigKey(f, R) {
  const st = f.state, m = f.move, A = (R || FIGHTERS[f.id]).anims;
  if (st === "attack" && m) {
    if (m.grab) return "grab";
    if (f.mname === "toss" || m.throw) return A.throw ? "throw" : "blast";
    if (m.sig && f.sigPose) return f.sigPose;
    const pn = targetPose(f);
    if (A[pn] && pn !== "idle0" && pn !== "idle1") return pn;
    return poseKey(f.mname, pn, m) || "strike";
  }
  if (st === "roll" || st === "spot" || st === "airdodge") return "dodge";
  if (st === "holding") return "grab";
  const pn = targetPose(f);
  return A[pn] ? pn : posemap()[pn] || "idle";
}
// Scarf Kid's boxes stay; a wide fighter whose painted fist or foot reaches past its box gets the box
// stretched to cover it (never moved or shrunk), so a hit you see is a hit you land.
function reachHitboxes(c) {
  const R = FIGHTERS[c.id], grow = (c.hw || 7) - 7;
  for (const n in c.mv) {   // 1) move with the wider body: one-sided boxes shift out, boxes around the body widen

      g.fillStyle=rgba(S.farWin,.85);for(let yy=H-h-26;yy<H;yy+=4.5)for(let xx=x+2;xx<x+w-2;xx+=3.5)if(rnd()<.18)g.fillRect(xx,yy,1.4,2);x+=w+1+(rnd()*6|0);}

function makeStage(i){

  g.strokeStyle=rgba(S.slabTop,.18);g.lineWidth=.6;for(let y=M.y+9;y<M.bot+16;y+=7){g.beginPath();g.moveTo(M.x0+8,y);g.lineTo(M.x1-8,y);g.stroke();}

  // walkable top surface
  const tg=g.createLinearGradient(0,M.y-1,0,M.y+6);tg.addColorStop(0,shade(S.slabTop,.35));tg.addColorStop(.4,S.slabTop);tg.addColorStop(1,S.slab);
  g.fillStyle=tg;g.beginPath();g.roundRect(M.x0-3,M.y-1,M.x1-M.x0+6,7,2);g.fill();

/* ---------------- drawing helpers (HD: smooth vector art) ---------------- */
const OUT='#140d22';
const SHADE={};
function shade(hex,amt){const k=hex+amt;if(SHADE[k])return SHADE[k];if(hex[0]!=='#'||hex.length!==7)return hex;const n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;const f=v=>Math.round(clamp(amt>0?v+(255-v)*amt:v*(1+amt),0,255));return SHADE[k]='#'+((1<<24)|(f(r)<<16)|(f(g)<<8)|f(b)).toString(16).slice(1);}
function rgba(hex,a){const n=parseInt(hex.slice(1),16);return`rgba(${n>>16},${n>>8&255},${n&255},${a})`;}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h);}
function disc(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}
function fontFor(size){if(PIXEL)return`700 ${size}px Silkscreen, ui-monospace, monospace`;return size>=18?`${Math.round(size*1.3)}px 'Bebas Neue', Impact, 'Arial Narrow', sans-serif`:`700 ${Math.round(size*1.2)}px Rajdhani, 'Segoe UI', system-ui, sans-serif`;}
function txt(s,x,y,size,col,align,stroke){ctx.font=fontFor(size);ctx.textAlign=align||'center';ctx.textBaseline='middle';if(stroke!==false){ctx.lineWidth=Math.max(3,size/5);ctx.strokeStyle='#0b0614';ctx.lineJoin='round';ctx.strokeText(s,x,y);}ctx.fillStyle=col;ctx.fillText(s,x,y);}

/* Heads: drawn in local units, head centre at 0,0, facing +x. About 13 units across. */
let HO=OUT;
function fs(col){ctx.fillStyle=col;ctx.fill();ctx.lineWidth=.85;ctx.strokeStyle=HO;ctx.stroke();}
function oval(x,y,rx,ry,col,rot){ctx.beginPath();ctx.ellipse(x,y,rx,ry,rot||0,0,Math.PI*2);fs(col);}
function poly(pts,col){ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.closePath();fs(col);}

  ironjaw:{armor:true,chest:1.12,arm:1.1,hand:1.3,foot:1.18},
  zenith:{hem:3.4,collar:true,trim:'#ffd23d',

function capPath(a,b,wa,wb,ba,bb){   // tapered capsule a->b; ba/bb bulge out each side at the middle

/* ---------------- items ---------------- */
const BOMBM={dmg:15,bkb:5,kbg:4.8,ang:60,proj:1};
function itemRate(){return G.mode==='battle'?G.rules.items:1;}
function floorAt(x,py,y){const M=STAGE.main;if(x>M.x0&&x<M.x1&&py<=M.y+.5&&y>=M.y)return M.y;for(const P of STAGE.soft)if(x>P.x0&&x<P.x1&&py<=P.y+Math.abs(P.dy||0)+1&&y>=P.y)return P.y;return null;}
function spawnItem(){const M=STAGE.main,types=['heal','bomb','bomb','star'];G.items.push({type:types[R()*types.length|0],x:rr(M.x0+24,M.x1-24),y:-20,vx:0,vy:0,state:'ground',t:0,onGround:false});}
function updItems(){
  const rate=itemRate();
  if(rate>0&&--G.itemT<=0){G.itemT=rate===2?rr(300,420)|0:rr(600,840)|0;if(G.items.length<(rate===2?3:2))spawnItem();}
  for(const it of G.items){
    it.t++;
    if(it.state==='held'){const f=it.owner;if(!f||f.item!==it){it.dead=true;continue;}it.x=f.x+f.face*9*f.c.s;it.y=f.y-24*f.c.s;continue;}
    it.vy=Math.min(it.vy+.35,8);const py=it.y;it.x+=it.vx;it.y+=it.vy;
    const fl=it.vy>=0?floorAt(it.x,py,it.y):null;
    if(fl!==null){it.y=fl;if(it.state==='thrown'){explode(it);continue;}it.vy=0;it.vx*=.6;it.onGround=true;
      for(const P of STAGE.soft)if(P.y===fl&&it.x>P.x0&&it.x<P.x1)it.x+=P.dx||0;}
    else it.onGround=false;
    if(it.state==='thrown'){for(const f of G.f){if((f===it.owner&&it.t<20)||f.state==='dead'||intangible(f))continue;const hr=hurt(f);if(hr&&it.x>hr.x-4&&it.x<hr.x+hr.w+4&&it.y>hr.y-4&&it.y<hr.y+hr.h+8){explode(it);break;}}}
    else{
      if(it.type!=='bomb')for(const f of G.f){if(f.state==='dead'||f.hidden)continue;if(Math.abs(f.x-it.x)<12&&Math.abs((f.y-14)-it.y)<22){useItem(f,it);break;}}
      if(it.t>900)it.dead=true;
    }
    if(it.y>BL.b||it.x<BL.l||it.x>BL.r)it.dead=true;
  }
  G.items=G.items.filter(i=>!i.dead);
}
function useItem(f,it){
  it.dead=true;
  if(it.type==='heal'){f.pct=Math.max(0,f.pct-25);popup('+HEAL',f.x,f.y-60,16,'#7fffb0',40);SFX.check();burst(f.x,f.y-24,14,['#ff5b7a','#ffffff'],1.6,18,2,-.05);}
  else{f.power=480;popup('POWER UP!',f.x,f.y-60,18,'#ffd23d',45);SFX.super();}
}
function nearItem(f){return G.items.find(it=>it.type==='bomb'&&it.state==='ground'&&it.onGround&&Math.abs(it.x-f.x)<16&&Math.abs(it.y-f.y)<20);}
function pickItem(f,it){it.state='held';it.owner=f;f.item=it;SFX.grab();}

  const it=f.item,h=f.inp,ax=axis(f);f.item=null;it.state='thrown';it.owner=f;it.t=0;it.x=f.x+f.face*10;it.y=f.y-30*f.c.s;

        if(f.x>h.x&&f.x<h.x+150&&f.y>M.y-30&&f.y<=M.y+2&&f.x>M.x0-10&&f.x<M.x1+10){h.hit.add(f);HAZ.combo=0;landHit(HAZ,f,TRAINM,f.x-10,f.x,f.y-20);}}
      if(h.x>BL.r+20){h.state=null;h.t=0;h.next=1500;}
    }
  }else if(Z==='fire'){
    if(!h.state&&h.t>=(h.next||700)){h.state='warn';h.t=0;h.spots=[rr(M.x0+30,M.x1-30),rr(M.x0+30,M.x1-30)];}
    else if(h.state==='warn'){if(h.t%12===0)G.shake=Math.max(G.shake,1.2);if(h.t>=90){h.state='go';h.t=0;h.hit=new Set();SFX.heavy();}}
    else if(h.state==='go'){
      for(const z of h.spots)for(const f of G.f){if(h.hit.has(f)||f.state==='dead'||intangible(f))continue;
        if(Math.abs(f.x-z)<15&&f.y>M.y-120&&f.y<=M.y+2){h.hit.add(f);HAZ.combo=0;landHit(HAZ,f,FIREM,z,f.x,f.y-20);}}

}

function step(){
  G.frame++;G.t++;
  if(G.white>0)G.white--;if(G.neg>0)G.neg--;if(G.domain>0&&!G.paused&&G.howto==null)G.domain--;
  G.shake=G.shake>.3?G.shake*.86:0;

  for(const b of G.bolts)b.life--;G.bolts=G.bolts.filter(b=>b.life>0);
  for(const k of G.kofx)k.t++;G.kofx=G.kofx.filter(k=>k.t<26);
  if(G.combo&&--G.combo.t<=0)G.combo=null;
  if(G.paused||(G.howto!=null&&!NET.on)){G.t--;return;}   // online, the How-to screen doesn't freeze the match
  if(G.finish)G.finish.t++;
  if(G.phase==='fight'&&G.timer>0&&G.freeze<=0&&--G.timer===0)timeUp();   // the match clock runs in real time, even through slow motion
  const ph=G.phase;
  if(ph==='title'||ph==='select'||ph==='ending'||ph==='rules'||ph==='settings'||ph==='online'||ph==='rewards')return;
  if(ph==='intro'){if(G.t>200)startFight();return;}
  if(ph==='result'){updParts();return;}
  if(G.freeze>0){G.freeze--;const f=G.freezeBy;updPose(f);if(G.freeze%2)G.parts.push({x:f.x+rr(-10,10),y:f.y-rr(0,40),vx:0,vy:-1.2,life:14,max:14,col:f.c.aura,size:2,grav:0});updParts();updCam();return;}
  if(G.stop>0){G.stop--;holdWindows();for(const f of G.f)if(f.sdi)sdiStep(f,G.stop===0);return;}
  if(G.slow>0){G.slow--;if(G.slow%3){holdWindows();updCam();return;}}
  const live=ph==='fight';
  if(live){G.fightT++;updStage();updHazard();updItems();for(const f of G.f)if(f.ai)aiThink(f,aiTarget(f));if(G.mode==='training'){G.p.meter=Math.min(100,G.p.meter+.5);trainSwing();}}
  for(const f of G.f){if(G.phase==='ko'&&f.state==='dead')continue;updFighter(f,other(f),live);}
  for(let a=0;a<G.f.length;a++)for(let b=a+1;b<G.f.length;b++)separate(G.f[a],G.f[b]);
  updProjs();updParts();
  for(const f of G.f)f.shownPct+=(f.pct-f.shownPct)*.3;
  updCam();
  if(ph==='ready'){if(G.t===20)announce('Ready...');if(G.t===20||G.t===50||G.t===80)SFX.count();if(G.t===110){SFX.go();announce('Go!');}if(G.t>=110){G.phase='fight';G.t=0;}}
  else if(ph==='ko'){if(G.t===70&&G.winner&&G.winner.state!=='dead'&&G.winner.onGround)G.winner.state='win';if(G.t>=160)afterKO();}
}

  const k=(fighting&&f&&f.meter>=100?'s':'')+'|'+(fighting?'p':'')+'|'+(f?f.c.sp[0]:'');

  document.querySelector('.pb.sup').classList.toggle('ready',fighting&&f&&f.meter>=100);

function fixPicks(){G.sel=G.sel.map(i=>avail(ROSTER[i])?i:0);for(const p of[0,1])for(const id in G.skins[p])if(!skinsFor(id).includes(G.skins[p][id]))delete G.skins[p][id];}
function goTitle(){fixPicks();if(NET.on)netClose();G.phase='title';G.t=0;G.paused=false;pauseBtn.textContent='Pause';}
function setPause(v){G.paused=v;G.pmenu=0;pauseBtn.textContent=v?'Resume':'Pause';}

function onPress(pl,btn){
  audio();
  // a connected guest sends its presses to the host instead of acting on them
  if(NET.guest&&NET.ready&&G.phase==='select'&&!G.lock[1]&&G.howto==null&&(btn==='left'||btn==='right'||btn==='up'||btn==='down'||btn==='stickup')){
    if(btn==='left'||btn==='right'){const n=ROSTER.length,d=btn==='left'?-1:1;let i=G.sel[1];do i=(i+d+n)%n;while(!avail(ROSTER[i]));netSend({c:'pick',i});SFX.blip();}
    else cycleSkin(1,ROSTER[G.sel[1]]);return;}
  if(NET.guest&&NET.ready&&G.phase!=='online'&&btn!=='help'&&btn!=='mute'&&G.howto==null){if(btn!=='tap')NET.out.push([++NET.seq,btn]);return;}
  let tapJump=true;if(btn==='stickup'){btn='up';tapJump=false;}
  if(btn==='help'){if(G.howto==null)openHowto();else G.howto=null;return;}
  if(G.howto!=null){
    if(btn==='left'||btn==='up'){G.howto=Math.max(0,G.howto-1);SFX.blip();}
    else if(btn==='right'||btn==='down'||btn==='tap'){if(G.howto<HOWTO.length-1){G.howto++;SFX.blip();}else if(btn==='tap')G.howto=null;}
    else if(btn==='attack'||btn==='start'||btn==='jump'){if(G.howto<HOWTO.length-1)G.howto++;else G.howto=null;SFX.blip();}
    else if(btn==='special'||btn==='pause')G.howto=null;
    return;
  }
  if(btn==='pause'){
    if(G.phase==='fight'||G.phase==='ready'){setPause(!G.paused);return;}
    if(G.phase==='online'){if(NET.view==='menu')goTitle();else{netClose();NET.view='menu';}return;}
    if(G.phase==='select'||G.phase==='rules'||G.phase==='settings'||G.phase==='rewards'){goTitle();return;}
    return;
  }
  if(G.paused){
    const n=PMENU().length;
    if(btn==='up'){G.pmenu=(G.pmenu+n-1)%n;SFX.blip();}
    else if(btn==='down'){G.pmenu=(G.pmenu+1)%n;SFX.blip();}
    else if(btn==='attack'||btn==='start'||btn==='jump')pauseSelect(G.pmenu);
    else if(btn==='special')setPause(false);
    return;
  }
  const ok=btn==='attack'||btn==='start'||(btn==='jump'&&G.phase!=='fight');
  switch(G.phase){
    case'title':
      if(btn==='up'){G.menu=(G.menu+MENU.length-1)%MENU.length;SFX.blip();}
      else if(btn==='down'){G.menu=(G.menu+1)%MENU.length;SFX.blip();}

      else if(ok){if(r===n-1){if(isR){G.lock=[false,false];G.phase='select';G.t=0;}else goTitle();}else(isR?changeRule:changeSet)(r,1);}
      else if(btn==='special')goTitle();

    case'online':
      if(NET.view==='menu'){if(btn==='up')NET.row=(NET.row+2)%3;else if(btn==='down')NET.row=(NET.row+1)%3;else if(ok)onlineChoose(NET.row);else if(btn==='special')goTitle();SFX.blip();}
      else if(btn==='special'||(ok&&NET.view==='error')){netClose();NET.view='menu';SFX.blip();}
      break;
    case'intro':if(ok&&G.t>30)startFight();break;

    case'fight':{const f=G.f[pl];if(f&&f.human)press(f,btn,tapJump);break;}

/* ---------------- online play ----------------
   One player hosts: their browser runs the real match. The guest's browser sends its button presses
   and draws the snapshots the host sends back every frame. The browsers talk directly (WebRTC);
   PeerJS's free server only introduces them using the room code. */
const NET={on:false,host:false,guest:false,ready:false,peer:null,conn:null,code:'',view:'menu',msg:'',row:0,ev:[],rh:{},seq:0,last:0,out:[],snaps:[],rtt:0,pingAt:0,saved:null,timer:null};
const ME=()=>NET.guest?1:0;
const PEER_URL='https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';
function loadPeer(){return new Promise((res,rej)=>{if(window.Peer)return res();const sc=document.createElement('script');sc.src=PEER_URL;sc.onload=()=>res();sc.onerror=()=>rej(new Error('load'));document.head.appendChild(sc);});}
const CODECH='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
function newCode(){let c='';for(let i=0;i<4;i++)c+=CODECH[R()*CODECH.length|0];return c;}
function netSend(o){try{if(NET.conn&&NET.conn.open)NET.conn.send(o);}catch(e){}}
function netClose(){
  if(NET.conn&&NET.conn.open)netSend({c:'bye'});
  try{NET.conn&&NET.conn.close()}catch(e){}try{NET.peer&&NET.peer.destroy()}catch(e){}
  clearTimeout(NET.timer);
  if(NET.saved)G.rules=NET.saved;
  if(NET.savedSkins){G.skins=NET.savedSkins;NET.savedSkins=null;}
  Object.assign(NET,{on:false,host:false,guest:false,ready:false,peer:null,conn:null,ev:[],rh:{},snaps:[],saved:null,out:[],seq:0,last:0,rtt:0});
}
function netFail(msg){netClose();NET.view='error';NET.msg=msg;G.phase='online';G.paused=false;G.howto=null;}
async function netHost(){
  Object.assign(NET,{view:'hosting',msg:'CONNECTING…',code:'',on:true,host:true});
  try{await loadPeer();}catch(e){return netFail('COULD NOT REACH THE ONLINE SERVICE');}
  if(!NET.on)return;
  NET.code=newCode();
  const peer=new Peer('qcc-'+NET.code.toLowerCase(),{debug:0});NET.peer=peer;
  peer.on('open',()=>{NET.msg='WAITING FOR YOUR FRIEND…';});
  peer.on('connection',conn=>{if(NET.conn){try{conn.close()}catch(e){}return;}netWire(conn);});
  peer.on('error',err=>{if(err.type==='unavailable-id'){try{peer.destroy()}catch(e){}NET.on=false;netHost();}else if(NET.on)netFail('ONLINE ERROR: '+String(err.type||'UNKNOWN').toUpperCase());});
}
async function netJoin(code){
  Object.assign(NET,{view:'joining',code,msg:'CONNECTING TO QCC-'+code+'…',on:true,guest:true});
  try{await loadPeer();}catch(e){return netFail('COULD NOT REACH THE ONLINE SERVICE');}
  if(!NET.on)return;
  const peer=new Peer({debug:0});NET.peer=peer;
  peer.on('open',()=>{netWire(peer.connect('qcc-'+code.toLowerCase(),{reliable:true,serialization:'json'}));});
  peer.on('error',err=>{if(NET.on)netFail(err.type==='peer-unavailable'?'NO GAME FOUND FOR QCC-'+code:'ONLINE ERROR: '+String(err.type||'UNKNOWN').toUpperCase());});

}
function netWire(conn){
  NET.conn=conn;
  conn.on('open',()=>{
    NET.ready=true;clearTimeout(NET.timer);NET.saved=JSON.parse(JSON.stringify(G.rules));NET.savedSkins=G.skins;G.skins=[{},{}];SFX.go();
    if(NET.host){const r=G.rules;G.rules=Object.assign({},r,{humans:2,cpus:clamp(r.humans===1?r.cpus-1:r.cpus,0,2)});G.mode='battle';G.sel=[0,1];G.lock=[false,false];G.phase='select';G.t=0;}
    else NET.msg='CONNECTED! WAITING FOR THE HOST…';

  conn.on('error',()=>{if(NET.on)netFail('CONNECTION LOST');});

function netMsg(d){

    o.frequency.exponentialRampToValueAtTime(42, t + 0.1);

  function envG(t, dur, v, atk, rel){
    const g = ac.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(v, t + atk);
    g.gain.setTargetAtTime(v * 0.65, t + atk, Math.max(0.03, dur * 0.4));
    g.gain.setTargetAtTime(0, t + Math.max(atk + 0.01, dur), rel / 3);

    o.type = type; o.frequency.setValueAtTime(f, t);

    if (dur < 0.28) return;

    l.frequency.value = 5.5;

    }
    dest = null; cur = -1;

  function start(n){

    dest = ac.createGain();
    dest.gain.value = 1;
    dest.connect(master);

      }

      step++; nextT += sd;
    }
  }

  function ensureTimer(){ if (!timer && enabled && want >= 0 && !ended) timer = setInterval(tick, 30); }
  function clearTimer(){ if (timer) { clearInterval(timer); timer = null; } }

  function play(track){
    if (!tracks[track] || track === want) return;
    want = track; ended = false;
    ensureTimer();
    tick();
  }
  function stop(){ want = -1; ended = false; fadeOut(0.4); clearTimer(); }
  function setEnabled(b){
    enabled = !!b;
    if (enabled) ensureTimer(); else { fadeOut(0.4); clearTimer(); }
  }
  function isEnabled(){ return enabled; }
  function duck(b){
    ducked = !!b;
    if (master && ac) {

  // Test helper: render a song into an offline audio context.
  function renderTo(ctx, n, secs){

    const T = tracks[n], sd = 60 / T.bpm / 4;

    ac = null; dest = null; cur = -1;
  }
  return { play: play, stop: stop, setEnabled: setEnabled, isEnabled: isEnabled, duck: duck, setVolume: setVolume, renderTo: renderTo, tracks: tracks };
}
